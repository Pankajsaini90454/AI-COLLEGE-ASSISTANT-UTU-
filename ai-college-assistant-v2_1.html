<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI College Assistant - 3D system design</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#05050a;color:#f1f1fa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1060px;margin:0 auto}
.layout{display:grid;grid-template-columns:172px minmax(0,1fr) 240px;gap:12px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px}
.side .row{margin:0}
.side .flowbtn{width:100%}
.side .chips{flex-direction:column;margin:0}
.side .chip{text-align:left}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7d83a8;margin:0 0 6px}
.right .info{position:sticky;top:14px}
@media(max-width:820px){.layout{grid-template-columns:1fr}.right{order:2}.left{order:3}.side .chips{flex-direction:row}}
.stage{position:relative}
.ttl{position:absolute;top:12px;left:0;right:0;margin:0;text-align:center;font-size:clamp(16px,3.6vw,28px);font-weight:800;letter-spacing:.05em;pointer-events:none;z-index:2;background:linear-gradient(90deg,#22D3EE,#A78BFA,#F472B6,#FDE047);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:13px;color:#9aa0c3;margin:0 0 10px;text-align:center}
.stage{width:100%;height:540px;border-radius:14px;overflow:hidden;background:#000;border:1px solid #23233a}
#c{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.btn{--c1:#4F8BFF;--c2:#2F5FE0;--c3:#1E3FA3;border:0;border-radius:12px;padding:10px 16px;min-height:42px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 5px 0 var(--c3),0 9px 14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c3),0 3px 6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.sel{outline:2px solid #fff;outline-offset:2px}
.sq{width:46px;padding:0;font-size:19px}
.teal{--c1:#2DD4BF;--c2:#0D9488;--c3:#0B6B63}
.chip{--c:#888;border:0;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;color:#e8e8f5;background:#1b1b2b;box-shadow:0 3px 0 #0a0a14,inset 0 0 0 1.5px var(--c);transition:transform .08s}
.chip:active{transform:translateY(2px)}
.chip.on{background:var(--c);color:#16110a;box-shadow:0 3px 0 rgba(0,0,0,.7)}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 12px}
.info{background:#11111c;border:1px solid #2a2a44;border-radius:14px;padding:14px 16px;min-height:140px}
#it{font-size:16px;font-weight:700;margin:0 0 3px;color:#fff}
#ib{font-size:14px;color:#b9bdd6;margin:0;line-height:1.5}
.err{padding:20px;text-align:center;color:#fca5a5;font-size:14px}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<p class="sub">Drag to rotate. Pinch or use + and - to zoom. Tap any box to see what it does.</p>
<div class="layout">
<div class="side left">
<div>
<p class="lbl">Move and zoom</p>
<div class="row">
<button class="btn sq" id="up" aria-label="Move up">&uarr;</button>
<button class="btn sq" id="dn" aria-label="Move down">&darr;</button>
<button class="btn sq" id="lf" aria-label="Move left">&larr;</button>
<button class="btn sq" id="rt" aria-label="Move right">&rarr;</button>
<button class="btn sq teal" id="zi" aria-label="Zoom in">+</button>
<button class="btn sq teal" id="zo" aria-label="Zoom out">&minus;</button>
</div>
<div class="row" style="margin-top:10px">
<button class="btn flowbtn" id="rs" style="--c1:#FB7185;--c2:#E11D48;--c3:#9F1239">Reset</button>
<button class="btn flowbtn" id="pp" style="--c1:#FACC15;--c2:#EAB308;--c3:#A16207;color:#2b1a00">Pause</button>
</div>
</div>
<div>
<p class="lbl">Flows</p>
<div class="row" id="flows" style="flex-direction:column"></div>
</div>
<div>
<p class="lbl">Steps</p>
<div class="chips" id="chips"></div>
</div>
</div>
<div class="stage">
<h1 class="ttl">AI COLLEGE ASSISTANT</h1>
<canvas id="c" aria-label="3D diagram of the AI College Assistant architecture" role="img"></canvas>
</div>
<div class="side right">
<p class="lbl">Details</p>
<div class="info" aria-live="polite"><p id="it"></p><p id="ib"></p></div>
</div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.querySelector('.stage').innerHTML='<p class="err">Could not load three.js. Check your connection and reload.</p>';return;}

/* ---------- data ---------- */
const PAL=['#FF5E62','#FF9A3D','#FFD54A','#34D399','#22D3EE','#60A5FA','#A78BFA','#F472B6'];
// key: [name, subtitle, [top, bottom], textColor, x, y, description]
const ND={
U:['User','Student',['#FF9A3D','#FF5E62'],'#fff',-3.4,1.2,'The student types a question in the HTML chat page. The frontend sends it to RAG as a query.'],
R:['RAG','Retrieval logic',['#8E5CFF','#5B3DF5'],'#fff',0,1.2,'The retrieval logic inside FastAPI. It checks the cache, gets context from the database, builds the prompt and calls Ollama.'],
C:['Redis','Cache',['#FF5C7A','#E11D48'],'#fff',3.4,2.8,'The cache. It keeps recent question and answer pairs for a while. A hit returns an answer instantly and skips the model.'],
P:['Postgres','Database',['#38BDF8','#2563EB'],'#fff',3.4,1.2,'The database. It stores documents, text chunks and embeddings. pgvector finds the chunks closest to the question.'],
L:['Ollama 3.2','Local LLM',['#34D399','#059669'],'#fff',0,-0.6,'The local open-source model. It reads the question plus the retrieved context and writes the answer. It can also call the fetch tool.'],
A:['Answer','Q and A',['#FFD54A','#FF9F1C'],'#2b1a00',-3.4,-0.6,'The question and answer output. This is the reply the student sees, and it is also saved in Redis for next time.'],
F:['Fetch','Gets files',['#C084FC','#9333EA'],'#fff',3.4,-0.6,'The tool Ollama calls to get a file such as notes, a syllabus or a timetable, then pass its text on for storage.'],
D:['File','Source docs',['#22D3EE','#0EA5E9'],'#04202b',0,-2.4,'The source document. It can be an image, a video or a PDF that has to be read before it can be searched.'],
O:['Tesseract','OCR for images',['#F472B6','#DB2777'],'#fff',-3.4,-2.4,'Tesseract OCR reads text from images and from video frames so that scanned notes become searchable text.'],
Q:['PDF convert','md, csv, json',['#A3E635','#65A30D'],'#142003',3.4,-2.4,'Converts a PDF into markdown, csv or json so the content is readable and can be stored in Postgres.']};

// edges: [from point, to point] (stored in the direction of the main arrow)
const E={UR:[[-2.1,1.2],[-1.3,1.2]],RC:[[1.3,1.2],[2.1,2.8]],RP:[[1.3,1.2],[2.1,1.2]],RL:[[0,0.7],[0,-0.1]],LA:[[-1.3,-0.6],[-2.1,-0.6]],AU:[[-3.4,-0.1],[-3.4,0.7]],LF:[[1.3,-0.6],[2.1,-0.6]],FP:[[3.4,-0.1],[3.4,0.7]],CP:[[3.4,2.3],[3.4,1.7]],FD:[[3.4,-1.1],[1.0,-1.9]],DO:[[-1.3,-2.4],[-2.1,-2.4]],DQ:[[1.3,-2.4],[2.1,-2.4]]};

const FL={
hit:{label:'Cache hit',cols:['#34D399','#059669','#047857'],n:['U','R','C','R','U'],s:[
['Query','The student sends the question to RAG.'],
['Check cache','RAG looks the question up in Redis.'],
['Cache hit','Redis returns the saved answer to RAG.'],
['Reply','The saved answer is shown to the student. Ollama is skipped.']]},
miss:{label:'Cache miss',cols:['#FB923C','#EA580C','#9A3412'],n:['U','R','C','P','R','L','A','U'],s:[
['Query','The student sends the question to RAG.'],
['Check cache','RAG looks the question up in Redis.'],
['Miss','Nothing is saved, so Redis hands over to Postgres.'],
['Get context','Postgres returns the most relevant chunks to RAG.'],
['Build prompt','RAG sends the question plus context to Ollama 3.2.'],
['Generate','Ollama 3.2 writes the answer from that context.'],
['Reply','The answer is shown to the student and saved in Redis.']]},
fetch:{label:'Fetch file',cols:['#A78BFA','#7C3AED','#5B21B6'],n:['U','R','L','F','D','O','D','F','P'],s:[
['Ask','The student asks about a document.'],
['Plan','RAG asks Ollama 3.2 what to do.'],
['Call fetch','Ollama calls the fetch tool.'],
['Get file','Fetch locates the file.'],
['Read text','Tesseract OCR reads the text from the image.'],
['Return text','The OCR text goes back to the file step.'],
['Send text','Fetch receives the clean text.'],
['Store','The text is saved in Postgres for future queries.']]},
pdf:{label:'Read PDF',cols:['#A3E635','#65A30D','#3F6212'],n:['U','R','L','F','D','Q','D','F','P'],s:[
['Ask','The student asks about a PDF.'],
['Plan','RAG asks Ollama 3.2 what to do.'],
['Call fetch','Ollama calls the fetch tool.'],
['Get file','Fetch locates the PDF.'],
['Convert','PDF convert turns it into markdown, csv or json.'],
['Return text','The converted text goes back to the file step.'],
['Send text','Fetch receives the clean text.'],
['Store','The text is saved in Postgres for future queries.']]}
};

/* ---------- renderer / camera ---------- */
const el=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:el,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(40,1,0.1,100);
let Z0=14;
function fit(){
  const w=el.clientWidth,h=el.clientHeight;
  if(!w||!h)return;
  const wasHome=Math.abs(camera.position.z-Z0)<1e-6;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  Z0=Math.max(14,10.6/(0.728*w/h));
  if(wasHome||camera.position.z<7)camera.position.z=Z0;
  camera.updateProjectionMatrix();
}
camera.position.set(0,0,Z0);
fit();
window.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(el);

scene.add(new THREE.AmbientLight(0xffffff,0.85));
const dl=new THREE.DirectionalLight(0xffffff,0.6);dl.position.set(4,8,10);scene.add(dl);

const stars=(function(){
  const pos=[];
  for(let i=0;i<260;i++){
    const r=26+Math.random()*34,th=Math.random()*6.2832,ph=Math.acos(2*Math.random()-1);
    pos.push(r*Math.sin(ph)*Math.cos(th),r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph));
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({size:0.14,color:0x9aa7ff,transparent:true,opacity:0.85}));
  scene.add(p);return p;
})();

const GY0=-0.6,RX=0.22,RY=-0.4;
const group=new THREE.Group();
group.position.set(0,GY0,0);
group.rotation.set(RX,RY,0);
scene.add(group);

/* ---------- boxes ---------- */
const boxes=[],boxMap={},N={};
const BW=2.6;
Object.keys(ND).forEach(k=>{
  const [name,sub,cols,tc,x,y]=ND[k];
  N[k]=[x,y];
  const cv=document.createElement('canvas');cv.width=BW*200;cv.height=200;
  const g=cv.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,200);gr.addColorStop(0,cols[0]);gr.addColorStop(1,cols[1]);
  g.fillStyle=gr;g.fillRect(0,0,cv.width,200);
  g.fillStyle='rgba(255,255,255,0.14)';g.fillRect(0,0,cv.width,70);
  g.strokeStyle='rgba(255,255,255,0.35)';g.lineWidth=6;g.strokeRect(3,3,cv.width-6,194);
  g.textAlign='center';g.fillStyle=tc;
  g.font='bold 72px sans-serif';g.fillText(name,cv.width/2,88);
  g.globalAlpha=0.88;g.font='500 54px sans-serif';g.fillText(sub,cv.width/2,156);
  const side=new THREE.MeshLambertMaterial({color:cols[1]});
  const face=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv)});
  const m=new THREE.Mesh(new THREE.BoxGeometry(BW,1,1.4),[side,side,side,side,face,side]);
  m.position.set(x,y,0);m.userData.key=k;
  group.add(m);boxes.push(m);boxMap[k]=m;
});

/* ---------- edges ---------- */
const arrows=[];
Object.keys(E).forEach((k,i)=>{
  const a=E[k][0],b=E[k][1];
  const gm=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(a[0],a[1],0),new THREE.Vector3(b[0],b[1],0)]);
  group.add(new THREE.Line(gm,new THREE.LineBasicMaterial({color:0x8FA2D8})));
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.32,12),new THREE.MeshBasicMaterial({color:0x67E8F9}));
  const dir=new THREE.Vector3(b[0]-a[0],b[1]-a[1],0).normalize();
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  group.add(cone);
  arrows.push({m:cone,a:a,b:b,o:(i*0.17)%1});
});
function edgeFor(f,t){
  if(E[f+t])return{k:f+t,a:E[f+t][0],b:E[f+t][1]};
  const k=t+f;
  if(!E[k])throw new Error('No edge between '+f+' and '+t);
  return{k:k,a:E[k][1],b:E[k][0]};
}

const outline=new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(BW+0.16,1.16,1.56)),
  new THREE.LineBasicMaterial({color:0xFFD54A}));
outline.visible=false;group.add(outline);

/* ---------- ball + halo ---------- */
const ball=new THREE.Mesh(new THREE.SphereGeometry(0.26,24,24),new THREE.MeshBasicMaterial({color:PAL[0]}));
group.add(ball);
const halo=(function(){
  const hc=document.createElement('canvas');hc.width=hc.height=128;
  const hg=hc.getContext('2d'),rg=hg.createRadialGradient(64,64,0,64,64,64);
  rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(0.4,'rgba(255,255,255,0.45)');rg.addColorStop(1,'rgba(255,255,255,0)');
  hg.fillStyle=rg;hg.fillRect(0,0,128,128);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(hc),color:PAL[0],blending:THREE.AdditiveBlending,depthTest:false,transparent:true}));
  sp.renderOrder=9;group.add(sp);return sp;
})();
const tcol=new THREE.Color(PAL[0]);

function v(p){return new THREE.Vector3(p[0],p[1],0.85);}
function badge(n,col){
  const cv=document.createElement('canvas');cv.width=cv.height=128;
  const g=cv.getContext('2d');
  g.beginPath();g.arc(64,64,58,0,6.2832);g.fillStyle=col;g.fill();
  g.lineWidth=8;g.strokeStyle='#ffffff';g.stroke();
  g.fillStyle='#14102a';g.font='bold 74px sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText(String(n),64,70);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false,transparent:true}));
  sp.renderOrder=10;return sp;
}

/* ---------- flow state ---------- */
const chipsEl=document.getElementById('chips'),it=document.getElementById('it'),ib=document.getElementById('ib');
const flowsEl=document.getElementById('flows');
const flowBtns={};
let fl,moves=[],badges=[],chipEls=[],seg=0,d=0,pause=0,mode='step',paused=false,wrap=false;

function disposeBadge(s){
  group.remove(s);
  if(s.material.map)s.material.map.dispose();
  s.material.dispose();
}
function setFlow(key){
  fl=FL[key];
  Object.keys(flowBtns).forEach(k=>flowBtns[k].classList.toggle('sel',k===key));
  badges.forEach(disposeBadge);badges=[];
  const cnt={};moves=[];
  for(let i=0;i<fl.n.length-1;i++){
    const f=fl.n[i],t=fl.n[i+1],e=edgeFor(f,t);
    const pts=[v(N[f]),v(e.a),v(e.b),v(N[t])];
    let len=0;for(let j=1;j<4;j++)len+=pts[j].distanceTo(pts[j-1]);
    moves.push({pts:pts,len:len});
    // offset badges when several steps share the same edge
    cnt[e.k]=(cnt[e.k]||0)+1;
    const kk=cnt[e.k]-1;
    const dx=e.b[0]-e.a[0],dy=e.b[1]-e.a[1],L=Math.hypot(dx,dy);
    const o=kk===0?0:(kk%2?1:-1)*0.55*Math.ceil(kk/2);
    const sp=badge(i+1,PAL[i%PAL.length]);
    sp.position.set((e.a[0]+e.b[0])/2+(-dy/L)*o,(e.a[1]+e.b[1])/2+(dx/L)*o,1.0);
    group.add(sp);badges.push(sp);
  }
  chipsEl.innerHTML='';chipEls=[];
  fl.s.forEach((s,i)=>{
    const b=document.createElement('button');
    b.type='button';b.className='chip';b.style.setProperty('--c',PAL[i%PAL.length]);
    b.textContent=(i+1)+' '+s[0];
    b.addEventListener('click',()=>goTo(i));
    chipsEl.appendChild(b);chipEls.push(b);
  });
  seg=0;d=0;pause=0.3;wrap=false;mode='step';outline.visible=false;
  ball.position.copy(moves[0].pts[0]);
  ball.material.color.set(PAL[0]);halo.material.color.set(PAL[0]);
  say();
}
function goTo(i){
  seg=i;d=0;wrap=false;pause=0.3;
  ball.position.copy(moves[i].pts[0]);
  mode='step';outline.visible=false;say();
}
function say(){
  tcol.set(PAL[seg%PAL.length]);
  chipEls.forEach((b,i)=>b.classList.toggle('on',i===seg));
  badges.forEach((s,i)=>{const z=i===seg?1.0:0.62;s.scale.set(z,z,1);});
  if(mode==='step'){it.textContent=(seg+1)+'. '+fl.s[seg][0];ib.textContent=fl.s[seg][1];}
}
function along(m,dist){
  let r=dist;
  for(let j=1;j<4;j++){
    const a=m.pts[j-1],b=m.pts[j],L=a.distanceTo(b);
    if(r<=L||j===3)return new THREE.Vector3().lerpVectors(a,b,L>0?Math.min(r/L,1):1);
    r-=L;
  }
}
function select(k){
  mode='task';
  outline.position.copy(boxMap[k].position);outline.visible=true;
  it.textContent=ND[k][0]+' ('+ND[k][1]+')';ib.textContent=ND[k][6];
}

/* ---------- controls ---------- */
Object.keys(FL).forEach(k=>{
  const b=document.createElement('button');
  b.type='button';b.className='btn flowbtn';b.textContent=FL[k].label;
  b.style.setProperty('--c1',FL[k].cols[0]);b.style.setProperty('--c2',FL[k].cols[1]);b.style.setProperty('--c3',FL[k].cols[2]);
  b.addEventListener('click',()=>setFlow(k));
  flowsEl.appendChild(b);flowBtns[k]=b;
});

function zoom(f){camera.position.z=Math.max(7,Math.min(30,camera.position.z*f));}
function pan(dx,dy){
  const s=0.4*camera.position.z/15.5;
  group.position.x=Math.max(-9,Math.min(9,group.position.x+dx*s));
  group.position.y=Math.max(-9,Math.min(9,group.position.y+dy*s));
}
// Hold-to-repeat for pointers; Enter/Space (and key repeat) for keyboards.
function hold(id,fn){
  const b=document.getElementById(id);let iv=null;
  const stop=()=>{if(iv){clearInterval(iv);iv=null;}};
  b.addEventListener('pointerdown',()=>{stop();fn();iv=setInterval(fn,80);});
  ['pointerup','pointerleave','pointercancel','blur'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();}
  });
}
hold('up',()=>pan(0,1));hold('dn',()=>pan(0,-1));hold('lf',()=>pan(-1,0));hold('rt',()=>pan(1,0));
hold('zi',()=>zoom(0.94));hold('zo',()=>zoom(1.06));
document.getElementById('rs').addEventListener('click',()=>{
  group.rotation.set(RX,RY,0);group.position.set(0,GY0,0);camera.position.z=Z0;
});
const ppBtn=document.getElementById('pp');
ppBtn.addEventListener('click',()=>{
  paused=!paused;
  ppBtn.textContent=paused?'Play':'Pause';
});

/* ---------- pointer interaction (rotate, pinch, tap to select) ---------- */
const ray=new THREE.Raycaster(),ptrs=new Map();
let down=null,pinch=0;
function pdist(){const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
el.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.style.cursor='grabbing';
  if(ptrs.size===1)down={t:performance.now(),m:0};else{down=null;pinch=pdist();}
});
el.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){
    if(down)down.m+=Math.abs(dx)+Math.abs(dy);
    group.rotation.y=Math.max(-1.3,Math.min(1.3,group.rotation.y+dx*0.01));
    group.rotation.x=Math.max(-0.6,Math.min(0.7,group.rotation.x+dy*0.01));
  }else if(ptrs.size===2){
    const nd=pdist();
    if(pinch>0&&nd>0)zoom(pinch/nd);
    pinch=nd;
  }
});
function up(e){
  const wasOne=ptrs.size===1;
  if(wasOne&&down&&down.m<8&&performance.now()-down.t<600&&e.type==='pointerup'){
    const r=el.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1),camera);
    const h=ray.intersectObjects(boxes,false);
    if(h.length)select(h[0].object.userData.key);
    else{mode='step';outline.visible=false;say();}
  }
  ptrs.delete(e.pointerId);down=null;pinch=0;el.style.cursor='grab';
}
el.addEventListener('pointerup',up);
el.addEventListener('pointercancel',up);
el.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.08:0.92);},{passive:false});

/* ---------- animation loop ---------- */
let last=performance.now();
document.addEventListener('visibilitychange',()=>{last=performance.now();});
function loop(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;
  const tm=now/1000;
  stars.rotation.y+=dt*0.015;
  arrows.forEach(a=>{
    const u=(tm*0.4+a.o)%1;
    a.m.position.set(a.a[0]+(a.b[0]-a.a[0])*u,a.a[1]+(a.b[1]-a.a[1])*u,0.05);
  });
  if(!paused){
    if(pause>0){pause-=dt;}
    else if(wrap){wrap=false;seg=0;d=0;pause=0.4;ball.position.copy(moves[0].pts[0]);say();}
    else{
      const m=moves[seg];d+=dt*3;
      if(d>=m.len){
        ball.position.copy(m.pts[3]);d=0;
        if(seg+1>=moves.length){wrap=true;pause=1.3;}
        else{seg++;pause=0.45;say();}
      }else ball.position.copy(along(m,d));
    }
  }
  const k=Math.min(1,dt*7);
  ball.material.color.lerp(tcol,k);
  halo.material.color.lerp(tcol,k);
  halo.position.copy(ball.position);
  const hs=1.2+0.25*Math.sin(tm*6);halo.scale.set(hs,hs,1);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

setFlow('miss');
requestAnimationFrame(loop);
})();
</script>
